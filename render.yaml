services:
  - type: web
    name: linguapath
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    nodeVersion: "20"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false          # MongoDB Atlas connection string — set manually in Render dashboard
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false          # Set to your Render URL, e.g. https://linguapath.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true  # Bearer token for /api/cron/* — copy into the cron job below
      # Optional: only needed if this service is ever scaled past 1 instance.
      # Without it, group chat / group quiz only work within a single instance.
      # - key: REDIS_URL
      #   sync: false

  # Hourly trigger for the daily study reminder. Each user is notified at their own
  # local reminderHour, so this must run every hour rather than once a day.
  - type: cron
    name: linguapath-daily-reminder
    runtime: node
    plan: free
    region: oregon
    schedule: "0 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsS -H "Authorization: Bearer $CRON_SECRET"
      "$APP_URL/api/cron/daily-reminder"
    envVars:
      - key: CRON_SECRET
        fromService:
          name: linguapath
          type: web
          envVarKey: CRON_SECRET
      - key: APP_URL
        sync: false          # e.g. https://linguapath.onrender.com
